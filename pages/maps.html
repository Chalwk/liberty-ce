<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberty Gaming - Maps</title>
    <link href="../core.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script defer src="../nav-menu.js"></script>
    <style>
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 1.5rem;
            margin-bottom: 3rem;
        }
        .map-card {
            background: rgba(26, 30, 36, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition);
        }
        .map-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px var(--primary);
        }
        .map-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 2px solid var(--border-glow);
        }
        .map-info {
            padding: 1.2rem;
        }
        .map-info h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
            word-break: break-word;
        }
        .download-btn {
            display: inline-block;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .download-btn:hover {
            border-bottom-color: var(--accent);
        }
        .server-heading {
            color: var(--primary);
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            margin: 2.5rem 0 1rem 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .server-heading:first-of-type {
            margin-top: 1rem;
        }
        .note {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .search-bar {
            margin: 1.5rem 0 2rem 0;
            display: flex;
            align-items: center;
            background: rgba(26, 30, 36, 0.6);
            border: 1px solid var(--border-glow);
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            max-width: 500px;
        }
        .search-bar i {
            color: var(--primary);
            font-size: 1.2rem;
            margin-right: 0.8rem;
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        .loading, .error {
            color: var(--text-muted);
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
        }
        .error {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
<header class="header"></header>

<main>
    <h1>Custom Maps</h1>
    <p class="note">Download custom maps for our servers. Click the link to get the .zip file.</p>

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <label for="mapSearch"></label><input type="text" id="mapSearch" placeholder="Filter maps by name...">
    </div>

    <div id="maps-container">
        <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading maps...</div>
    </div>
</main>

<script>
    (function() {
        const baseUrl = 'https://maps.halonet.net/maps/';
        const mapsTxtPath = '../maps.txt';

        const serverHeadings = {
            'racing': '! ++ LIBERTY - RACING ++ !',
            'standard': '! ++ LIBERTY ++ !'
        };

        let allMaps = [];

        const container = document.getElementById('maps-container');
        const searchInput = document.getElementById('mapSearch');

        fetch(mapsTxtPath)
            .then(response => {
            if (!response.ok) {
                throw new Error(`Failed to load maps.txt (${response.status})`);
            }
            return response.text();
        })
            .then(data => {
            const lines = data.split(/\r?\n/);
            allMaps = lines
                .map(line => line.trim())
                .filter(line => line && !line.startsWith('#'))
                .map(line => {
                const parts = line.split(';');
                if (parts.length < 2) return null;
                return {
                    server: parts[0].trim(),
                    mapname: parts[1].trim()
                };
            })
                .filter(item => item !== null && item.server && item.mapname);

            renderMaps('');
        })
            .catch(error => {
            container.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> Error loading maps: ${error.message}</div>`;
        });

        function renderMaps(filterText) {
            if (!allMaps.length) {
                container.innerHTML = '<div class="loading">No maps available.</div>';
                return;
            }

            const lowerFilter = filterText.toLowerCase();
            const filtered = allMaps.filter(m => m.mapname.toLowerCase().includes(lowerFilter));

            const groups = {};
            filtered.forEach(m => {
                if (!groups[m.server]) groups[m.server] = [];
                groups[m.server].push(m.mapname);
            });

            if (Object.keys(groups).length === 0) {
                container.innerHTML = '<div class="error">No maps match your filter.</div>';
                return;
            }

            let html = '';
            for (const [server, mapnames] of Object.entries(groups)) {
                const heading = serverHeadings[server] || server;
                html += `<h2 class="server-heading">${heading}</h2>`;
                html += '<div class="maps-grid">';

                mapnames.forEach(mapname => {
                    const encodedMapName = encodeURIComponent(mapname);
                    html += `
                        <div class="map-card">
                            <img src="../images/maps/${encodedMapName}.png" alt="${mapname}" onerror="this.onerror=null; this.src='../images/map-placeholder.jpg';">
                            <div class="map-info">
                                <h3>${mapname}</h3>
                                <a href="${baseUrl}${mapname}.zip" class="download-btn" target="_blank">Download →</a>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
            }

            container.innerHTML = html;
        }

        let debounceTimer;
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                renderMaps(this.value);
            }, 200);
        });
    })();
</script>
</body>
</html>
