<style>
    :root {
        --bg-panel: rgba(10, 12, 15, 0.8);
        --bg-panel-light: rgba(20, 22, 26, 0.9);
        --border-glow: rgba(42, 169, 161, 0.5);
        --primary: #2aa9a1;
        --primary-dark: #1e7e78;
        --text-muted: #aaa;
        --text-light: #fff;
        --accent: #2aa9a1;
        --danger: #e06c75;
        --transition: all 0.2s ease;
    }

    .members-stats-card {
        background: #0f1217;
        border: 1px solid var(--primary);
        border-radius: 24px;
        max-width: 100%;
        box-shadow: 0 0 20px rgba(42, 169, 161, 0.2);
        overflow: hidden;
        transition: var(--transition);
    }

    .members-stats-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-glow);
        padding: 1rem 1.5rem;
        background: rgba(0, 0, 0, 0.2);
    }

    .members-stats-header h3 {
        color: var(--primary);
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .members-stats-header h3 i {
        font-size: 1.3rem;
    }

    .member-badge {
        background: rgba(42, 169, 161, 0.2);
        border-radius: 40px;
        padding: 0.25rem 0.9rem;
        font-size: 0.8rem;
        color: var(--primary);
        font-weight: 500;
        letter-spacing: 0.3px;
    }

    .members-detail-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        background: #0f1217;
    }

    .members-detail-table th,
    .members-detail-table td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgba(42, 169, 161, 0.2);
        text-align: left;
        color: var(--text-light);
    }

    .members-detail-table th {
        color: var(--primary);
        font-weight: 600;
        background: rgba(0, 0, 0, 0.3);
        white-space: nowrap;
        font-size: 0.85rem;
        letter-spacing: 0.3px;
    }

    .members-detail-table tr:hover td {
        background: rgba(42, 169, 161, 0.08);
    }

    .members-detail-table td:first-child,
    .members-detail-table th:first-child {
        padding-left: 1.5rem;
    }

    .members-detail-table td:last-child,
    .members-detail-table th:last-child {
        padding-right: 1.5rem;
    }

    .country-flag {
        font-size: 1.25rem;
        line-height: 1;
        margin-right: 0.4rem;
        vertical-align: middle;
        display: inline-block;
    }

    .role-founder {
        color: var(--primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(42, 169, 161, 0.15);
        border: 1px solid rgba(42, 169, 161, 0.5);
        border-radius: 30px;
        padding: 0.2rem 0.65rem;
        font-size: 0.7rem;
        line-height: 1;
        display: inline-block;
        white-space: nowrap;
    }

    .status-text {
        font-size: 0.85rem;
        font-weight: 500;
    }

    .loading-row td,
    .error-row td,
    .no-results-row td {
        text-align: center;
        padding: 2rem !important;
        color: var(--text-muted);
        font-style: italic;
    }

    .loading-spinner-small {
        display: inline-block;
        margin-right: 0.5rem;
    }

    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
    }

    @media (max-width: 640px) {
        .members-detail-table th,
        .members-detail-table td {
            padding: 0.65rem 0.8rem;
            white-space: nowrap;
        }

        .members-stats-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .member-badge {
            align-self: flex-start;
        }

        .members-detail-table td:first-child,
        .members-detail-table th:first-child {
            padding-left: 1rem;
        }

        .members-detail-table td:last-child,
        .members-detail-table th:last-child {
            padding-right: 1rem;
        }
    }
</style>

<div class="members-stats-card">
    <div class="members-stats-header">
        <h3>
            <i class="fas fa-users" style="color: var(--primary);"></i>
            Guild Members
        </h3>
        <span class="member-badge" id="total-member-count-badge">
            <i class="fas fa-user-check"></i> <span id="total-member-count">0</span> total
        </span>
    </div>
    <div class="table-responsive">
        <table class="members-detail-table">
            <thead>
            <tr>
                <th><i class="fas fa-tag"></i> Member</th>
                <th><i class="fas fa-globe"></i> Country</th>
                <th><i class="fas fa-medal"></i> Status</th>
            </tr>
            </thead>
            <tbody id="members-tbody">
            <tr class="loading-row">
                <td colspan="3" style="text-align: center;">
                    <i class="fas fa-spinner fa-pulse loading-spinner-small"></i> Loading roster...
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tbody = document.getElementById('members-tbody');
        const memberCountSpan = document.getElementById('total-member-count');
        if (!tbody) return;

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatRoleText(roleRaw) {
            if (!roleRaw) return '<span class="status-text">Member</span>';
            const roleChunks = roleRaw.split(/,|\/|\\|\s\/\s/).map(r => r.trim()).filter(Boolean);
            if (roleChunks.length === 0) return '<span class="status-text">Member</span>';

            if (roleChunks.length > 1) {
                const parts = roleChunks.map((role, idx) => {
                    if (/\bFounder\b/i.test(role)) {
                        return `<span class="role-founder">${escapeHtml(role)}</span>`;
                    }
                    return `<span class="status-text">${escapeHtml(role)}</span>`;
                });
                return parts.reduce((prev, curr, i) => {
                    if (i === 0) return curr;
                    return prev + ', ' + curr;
                }, '');
            } else {
                const singleRole = roleChunks[0];
                if (/\bFounder\b/i.test(singleRole)) {
                    return `<span class="role-founder">${escapeHtml(singleRole)}</span>`;
                } else {
                    return `<span class="status-text">${escapeHtml(singleRole)}</span>`;
                }
            }
        }

        fetch('../data/members.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const lines = data.split('\n').filter(line => line.trim() !== '');
                tbody.innerHTML = '';
                let validCount = 0;

                if (lines.length === 0) {
                    tbody.innerHTML = '<tr class="no-results-row"><td colspan="3"><i class="fas fa-info-circle"></i> No members found.</td></tr>';
                    if (memberCountSpan) memberCountSpan.textContent = '0';
                    return;
                }

                for (const line of lines) {
                    const parts = line.split(';').map(s => s.trim());
                    if (parts.length < 3) continue;

                    const [name, flagCountry, roles] = parts;
                    let flagEmoji = flagCountry;
                    let countryName = '';
                    const firstSpace = flagCountry.indexOf(' ');
                    if (firstSpace > -1) {
                        flagEmoji = flagCountry.substring(0, firstSpace);
                        countryName = flagCountry.substring(firstSpace + 1);
                    }

                    const tr = document.createElement('tr');
                    const tdName = document.createElement('td');
                    tdName.setAttribute('data-label', 'Member');
                    tdName.innerHTML = `<i class="fas fa-user-astronaut" style="color: var(--primary); margin-right: 0.4rem;"></i>${escapeHtml(name)}`;
                    tr.appendChild(tdName);

                    const tdCountry = document.createElement('td');
                    tdCountry.setAttribute('data-label', 'Country');
                    const flagSpan = document.createElement('span');
                    flagSpan.className = 'country-flag';
                    flagSpan.textContent = flagEmoji;
                    tdCountry.appendChild(flagSpan);
                    if (countryName) {
                        tdCountry.appendChild(document.createTextNode(' ' + countryName));
                    } else if (flagEmoji && !countryName) {
                        tdCountry.appendChild(document.createTextNode(''));
                    }
                    tr.appendChild(tdCountry);

                    const tdRoles = document.createElement('td');
                    tdRoles.setAttribute('data-label', 'Status');
                    tdRoles.innerHTML = formatRoleText(roles);
                    tr.appendChild(tdRoles);

                    tbody.appendChild(tr);
                    validCount++;
                }

                if (memberCountSpan) {
                    memberCountSpan.textContent = validCount.toString();
                }

                if (validCount === 0 && tbody.children.length === 0) {
                    tbody.innerHTML = '<tr class="no-results-row"><td colspan="3"><i class="fas fa-search"></i> No valid member entries.</td></tr>';
                }
            })
            .catch(error => {
                console.error('members.txt load error:', error);
                if (memberCountSpan) {
                    memberCountSpan.textContent = '0';
                }
                if (tbody) {
                    tbody.innerHTML = `<tr class="error-row"><td colspan="3" style="color: #ff8a7a; text-align: center;"><i class="fas fa-exclamation-triangle"></i> Failed to load member data. Make sure members.txt exists in the data folder.</td></tr>`;
                }
                const badgeSpan = document.getElementById('total-member-count-badge');
                if (badgeSpan) {

                }
            });
    });
</script>
