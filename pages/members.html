<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Liberty Gaming - Members</title>
    <link href="../core.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script defer src="../nav-menu.js"></script>
    <style>
        .members-note {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-style: italic;
            font-family: var(--font-body), sans-serif;
        }

        .members-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 12, 15, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            font-family: var(--font-body), sans-serif;
        }

        .members-table th {
            background: var(--bg-panel);
            color: var(--primary);
            font-family: var(--font-header), sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid var(--border-glow);
        }

        .members-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-glow);
            color: var(--text-light);
            font-family: var(--font-body), sans-serif;
        }

        .members-table tr:last-child td {
            border-bottom: none;
        }

        .members-table tr:hover td {
            background: rgba(42, 169, 161, 0.1);
        }

        .country-flag {
            font-size: 1.4rem;
            line-height: 1;
            margin-right: 0.3rem;
        }
    </style>
</head>
<body>
<header class="header"></header>

<main>
    <h1 style="font-family: var(--font-header), sans-serif;">Members</h1>
    <p class="members-note">February 2026</p>

    <div class="table-responsive">
        <table class="members-table">
            <thead>
            <tr>
                <th>Member</th>
                <th>Country</th>
                <th>Discord Role(s)</th>
            </tr>
            </thead>
            <tbody id="members-tbody"></tbody>
        </table>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tbody = document.getElementById('members-tbody');
        if (!tbody) return;

        fetch('../members.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const lines = data.split('\n').filter(line => line.trim() !== '');
                tbody.innerHTML = '';

                lines.forEach(line => {
                    const parts = line.split(';').map(s => s.trim());
                    if (parts.length < 3) return;

                    const [name, flagCountry, roles] = parts;

                    let flagEmoji = flagCountry;
                    let countryName = '';
                    const firstSpace = flagCountry.indexOf(' ');
                    if (firstSpace > -1) {
                        flagEmoji = flagCountry.substring(0, firstSpace);
                        countryName = flagCountry.substring(firstSpace + 1);
                    }

                    const tr = document.createElement('tr');

                    const tdName = document.createElement('td');
                    tdName.textContent = name;
                    tdName.style.fontFamily = 'var(--font-body), sans-serif';
                    tr.appendChild(tdName);

                    const tdCountry = document.createElement('td');
                    tdCountry.style.fontFamily = 'var(--font-body), sans-serif';
                    const spanFlag = document.createElement('span');
                    spanFlag.className = 'country-flag';
                    spanFlag.textContent = flagEmoji;
                    tdCountry.appendChild(spanFlag);
                    if (countryName) {
                        tdCountry.appendChild(document.createTextNode(' ' + countryName));
                    }
                    tr.appendChild(tdCountry);

                    const tdRoles = document.createElement('td');
                    tdRoles.textContent = roles || 'Member';
                    tdRoles.style.fontFamily = 'var(--font-body), sans-serif';
                    tr.appendChild(tdRoles);

                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                tbody.innerHTML = `<tr><td colspan="3" style="color: var(--text-muted); text-align: center; padding: 2rem; font-family: var(--font-body), sans-serif;">⚠️ Error loading members: ${error.message}</td></tr>`;
            });
    });
</script>
</body>
</html>
