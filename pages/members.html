<h1>Members</h1>
<p class="members-note">March 2026 | Total Members: <span id="total-member-count">--</span></p>

<div class="table-responsive">
    <table class="members-table">
        <thead>
        <tr>
            <th>Member</th>
            <th>Country</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="members-tbody"></tbody>
    </table>
</div>

<style>
    .members-note {
        color: var(--text-muted);
        margin-bottom: 2rem;
        font-style: italic;
        font-family: var(--font-body), sans-serif;
    }

    .members-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(10, 12, 15, 0.8);
        border: 1px solid var(--border-glow);
        border-radius: 20px;
        overflow: hidden;
        font-family: var(--font-body), sans-serif;
    }

    .members-table th {
        background: var(--bg-panel);
        color: var(--primary);
        font-family: var(--font-header), sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 1rem;
        text-align: left;
        border-bottom: 2px solid var(--border-glow);
    }

    .members-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border-glow);
        color: var(--text-light);
        font-family: var(--font-body), sans-serif;
    }

    .members-table tr:last-child td {
        border-bottom: none;
    }

    .members-table tr:hover td {
        background: rgba(42, 169, 161, 0.1);
    }

    .role-founder {
        color: var(--primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: rgba(255, 206, 0, 0.15);
        border: 1px solid rgba(255, 206, 0, 0.5);
        border-radius: 6px;
        padding: 0.1rem 0.25rem;
        margin-right: 0.3rem;
        font-size: 0.85rem;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
    }

    .country-flag {
        font-size: 1.4rem;
        line-height: 1;
        margin-right: 0.3rem;
    }

    .table-responsive {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 840px) {
        .members-table {
            border: 0;
        }

        .members-table thead,
        .members-table tbody,
        .members-table th,
        .members-table td,
        .members-table tr {
            display: block;
        }

        .members-table thead tr {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }

        .members-table tr {
            margin: 0 0 0.5rem 0;
            background: rgba(10, 12, 15, 0.93);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 0.35rem;
        }

        .members-table td {
            padding: 0.45rem 0.3rem 0.45rem 50%;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            text-align: left;
        }

        .members-table td::before {
            content: attr(data-label);
            position: absolute;
            left: 0.75rem;
            width: 45%;
            white-space: normal;
            font-weight: 600;
            color: var(--text-muted);
            font-family: var(--font-body), sans-serif;
        }

        .members-table td:last-child {
            border-bottom: none;
        }

        .members-table tr:hover td {
            background: rgba(42, 169, 161, 0.05);
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tbody = document.getElementById('members-tbody');
        const memberCountSpan = document.getElementById('total-member-count');
        if (!tbody) return;

        fetch('../members.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const lines = data.split('\n').filter(line => line.trim() !== '');
                tbody.innerHTML = '';
                let validCount = 0;

                lines.forEach(line => {
                    const parts = line.split(';').map(s => s.trim());
                    if (parts.length < 3) return;

                    const [name, flagCountry, roles] = parts;
                    let flagEmoji = flagCountry;
                    let countryName = '';
                    const firstSpace = flagCountry.indexOf(' ');
                    if (firstSpace > -1) {
                        flagEmoji = flagCountry.substring(0, firstSpace);
                        countryName = flagCountry.substring(firstSpace + 1);
                    }

                    const tr = document.createElement('tr');

                    const tdName = document.createElement('td');
                    tdName.dataset.label = 'Member';
                    tdName.textContent = name;
                    tdName.style.fontFamily = 'var(--font-body), sans-serif';
                    tr.appendChild(tdName);

                    const tdCountry = document.createElement('td');
                    tdCountry.dataset.label = 'Country';
                    tdCountry.style.fontFamily = 'var(--font-body), sans-serif';
                    const spanFlag = document.createElement('span');
                    spanFlag.className = 'country-flag';
                    spanFlag.textContent = flagEmoji;
                    tdCountry.appendChild(spanFlag);
                    if (countryName) {
                        tdCountry.appendChild(document.createTextNode(' ' + countryName));
                    }
                    tr.appendChild(tdCountry);

                    const tdRoles = document.createElement('td');
                    tdRoles.dataset.label = 'Status';
                    const roleText = roles || 'Member';
                    tdRoles.style.fontFamily = 'var(--font-body), sans-serif';

                    const roleChunks = roleText.split(/,|\/|\\|\s\/\s/).map(r => r.trim()).filter(Boolean);
                    if (roleChunks.length > 1) {
                        tdRoles.innerHTML = roleChunks.map((role, index) => {
                            const content = /\bFounder\b/i.test(role)
                                ? `<span class="role-founder">${role}</span>`
                                : `<span>${role}</span>`;
                            return index > 0 ? `, ${content}` : content;
                        }).join('');
                    } else {
                        const role = roleChunks[0] || 'Member';
                        if (/\bFounder\b/i.test(role)) {
                            tdRoles.innerHTML = `<span class="role-founder">${role}</span>`;
                        } else {
                            tdRoles.textContent = role;
                        }
                    }

                    tr.appendChild(tdRoles);
                    tbody.appendChild(tr);
                    validCount++;
                });

                if (memberCountSpan) {
                    memberCountSpan.textContent = validCount.toString();
                }
            })
            .catch(error => {
                if (memberCountSpan) {
                    memberCountSpan.textContent = '0';
                }
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="3" style="color: var(--text-muted); text-align: center; padding: 2rem; font-family: var(--font-body), sans-serif;">⚠️ Error loading members: ${error.message}</td></tr>`;
                }
            });
    });
</script>
